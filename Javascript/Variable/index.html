<body>
  <h1>Day 1: JavaScript Practice</h1>
  

  <script>
    let x = 5;
    let y = 10;
    let z = x + y;
    alert("the sum of x and y = " + z); /* Displays an alert with the sum of x and y , + use for join string and number*/

    <p id="result">result will appear here</p>
    let _x = 20;
    let _100 = 30;
    let $y = _x + _100;
    document.getElementById("result").innerHTML = "the sum of _x and _100 = " + $y; /* Displays the sum of _x and _100 in the HTML element with id "result" */
  </script>
